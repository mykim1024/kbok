server.port=8081
spring.application.name=kbok

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/kbok
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG

# 로그 파일 위치 (프로젝트 루트의 logs 폴더)
logging.file.name=logs/kbok.log

# 파일이 10MB를 넘으면 새 파일로 나누고, 최근 7일치만 보관
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# 우리 코드는 INFO 이상만 기록
logging.level.com.example.kbok=INFO

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=1s